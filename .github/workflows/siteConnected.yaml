name: Deploy to N0C

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Aligné sur la version du serveur (php -v => 8.3)
          php-version: '8.3'
          extensions: mbstring, bcmath, ctype, json, tokenizer, xml, curl, dom, fileinfo, pdo, pdo_mysql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Composer install
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets (Inertia/React/Vite)
        run: npm run build

      # Backup de la version en ligne AVANT le rsync
      - name: Backup version actuelle
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            DEPLOY="${{ secrets.DEPLOY_PATH }}"
            STAMP=$(date +%Y%m%d_%H%M%S)
            BACKUP="$HOME/paradisia_old_$STAMP"
            if [ -d "$DEPLOY" ]; then
              # Copie (pas de mv : le .env n'existe que sur le serveur)
              # vendor et node_modules exclus pour alléger le backup
              rsync -a --exclude='vendor/' --exclude='node_modules/' "$DEPLOY/" "$BACKUP/"
              echo "Backup créé : $BACKUP"
            fi
            # Rotation : on ne garde que les 2 backups les plus récents
            ls -dt "$HOME"/paradisia_old_2* 2>/dev/null | tail -n +3 | xargs -r rm -rf

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: >-
            -avzr --delete
            --exclude='.env'
            --exclude='.git/'
            --exclude='.github/'
            --exclude='node_modules/'
            --exclude='tests/'
            --exclude='storage/logs/'
            --exclude='storage/framework/cache/'
            --exclude='storage/framework/sessions/'
            --exclude='storage/framework/views/'
            --exclude='storage/app/public/'
            --exclude='storage/app/private/'
            --exclude='public/uploads/'
          path: ./
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Post-deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            # PHP du sélecteur N0C (~/bin/php => /usr/bin/php 8.3, avec pdo/dom/etc.)
            export PATH=$HOME/bin:$PATH
            PHP=php
            DEPLOY="${{ secrets.DEPLOY_PATH }}"
            cd "$DEPLOY"

            # S'assurer que les dossiers storage existent (exclus du rsync)
            mkdir -p storage/framework/views
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/cache/data
            mkdir -p storage/logs
            mkdir -p storage/app/public
            mkdir -p storage/app/private

            # Permissions (tolérant : certains fichiers peuvent être verrouillés)
            echo "==> permissions"
            chmod -R 775 storage bootstrap/cache || echo "::warning::chmod partiel"

            # Publication unique des uploads historiques du projet vers le
            # docroot. Les nouveaux uploads vont directement dans
            # ~/public_html/uploads : public_path() y pointe désormais
            # (voir bootstrap/app.php). Le marqueur évite de re-copier (et de
            # ressusciter des fichiers supprimés) aux déploiements suivants.
            echo "==> publication des uploads historiques"
            MARK=storage/app/private/.uploads_publies
            if [ -d public/uploads ] && [ ! -f "$MARK" ]; then
              { mkdir -p ~/public_html/uploads \
                && rsync -a public/uploads/ ~/public_html/uploads/ \
                && touch "$MARK"; } || echo "::warning::publication des uploads échouée"
            fi

            # Lien symbolique storage (idempotent)
            echo "==> storage:link"
            $PHP artisan storage:link || true

            # Migrations. La base de prod vient d'un import SQL : baseline
            # marque d'abord comme exécutées celles dont les tables existent
            # déjà, puis migrate ne joue que les vraies nouveautés.
            echo "==> migrations"
            $PHP artisan migrate:baseline || echo "::warning::baseline a échoué"
            $PHP artisan migrate --force || echo "::warning::migrate a échoué"

            # Catalogue produits (idempotent)
            echo "==> catalogue produits"
            $PHP artisan db:seed --class=ProductCatalogSeeder --force || echo "::warning::seed catalogue a échoué"

            # Recharger les caches (clear avant cache pour éviter les chemins figés)
            $PHP artisan config:clear
            $PHP artisan config:cache
            # route:cache peut échouer à cause d'une page Folio défectueuse
            # (show.blade.php : parameter() on null) -> toléré avec avertissement
            $PHP artisan route:cache || echo "::warning::route:cache a échoué (page Folio à corriger), déploiement poursuivi"
            $PHP artisan view:cache

            # Resync des assets publics vers public_html
            # (préserve index.php modifié, .htaccess, .well-known, le symlink
            # storage et env_node géré par N0C)
            rsync -a --delete \
              --exclude='index.php' \
              --exclude='.htaccess' \
              --exclude='.well-known/' \
              --exclude='storage' \
              --exclude='env_node/' \
              --exclude='uploads/' \
              public/ ~/public_html/